<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="180" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="50%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
  </defs>
  
  <!-- Square background -->
  <rect width="180" height="180" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Laptop Base -->
  <path d="M32 125 L148 125 L158 142 L22 142 Z" fill="url(#laptopGrad)" stroke="#64748b" stroke-width="1"/>
  
  <!-- Laptop Screen Frame -->
  <rect x="38" y="38" width="104" height="82" rx="4" fill="url(#laptopGrad)" stroke="#64748b" stroke-width="1"/>
  
  <!-- Laptop Screen -->
  <rect x="44" y="44" width="92" height="70" rx="2" fill="url(#screenGrad)"/>
  
  <!-- Shield inside screen -->
  <g transform="translate(90, 79)">
    <!-- Shield shape -->
    <path d="M0 -26 L21 -19 L21 5 C21 16 10 26 0 32 C-10 26 -21 16 -21 5 L-21 -19 Z" 
          fill="url(#shieldBorder)" opacity="0.9"/>
    <path d="M0 -22 L18 -16 L18 4 C18 14 9 22 0 27 C-9 22 -18 14 -18 4 L-18 -16 Z" 
          fill="#1e293b"/>
    
    <!-- Quadrant dividers -->
    <line x1="0" y1="-17" x2="0" y2="20" stroke="#64748b" stroke-width="1"/>
    <line x1="-16" y1="2" x2="16" y2="2" stroke="#64748b" stroke-width="1"/>
    
    <!-- Top Left - Orange -->
    <rect x="-15" y="-15" width="13" height="15" fill="#f59e0b" rx="1"/>
    <rect x="-13" y="-12" width="9" height="2" fill="#fef3c7" rx="0.5"/>
    <rect x="-13" y="-8" width="9" height="2" fill="#fef3c7" rx="0.5"/>
    <rect x="-13" y="-4" width="9" height="2" fill="#fef3c7" rx="0.5"/>
    
    <!-- Top Right - Red -->
    <rect x="2" y="-15" width="13" height="15" fill="#ef4444" rx="1"/>
    <circle cx="8" cy="-7" r="3" fill="none" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="10" y="-8" width="4" height="2" fill="#fecaca"/>
    
    <!-- Bottom Left - Green -->
    <rect x="-15" y="4" width="13" height="15" fill="#22c55e" rx="1"/>
    <rect x="-13" y="13" width="3" height="4" fill="#dcfce7" rx="0.5" transform="rotate(180 -11.5 15)"/>
    <rect x="-9" y="11" width="3" height="6" fill="#dcfce7" rx="0.5" transform="rotate(180 -7.5 14)"/>
    <rect x="-5" y="9" width="3" height="8" fill="#dcfce7" rx="0.5" transform="rotate(180 -3.5 13)"/>
    
    <!-- Bottom Right - Blue -->
    <rect x="2" y="4" width="13" height="15" fill="#3b82f6" rx="1"/>
    <rect x="5" y="7" width="7" height="6" fill="#dbeafe" rx="1"/>
    <circle cx="8" cy="15" r="2" fill="#fbbf24"/>
  </g>
  
  <!-- Camera dot -->
  <circle cx="90" cy="41" r="1.5" fill="#475569"/>
  
  <!-- Text -->
  <text x="90" y="162" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="13" font-weight="bold">IT ZYZTEM</text>
</svg>
