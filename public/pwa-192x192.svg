<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="50%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
  </defs>
  
  <!-- Square background -->
  <rect width="192" height="192" rx="24" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="188" height="188" rx="22" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  
  <!-- Laptop Base -->
  <path d="M36 132 L156 132 L166 148 L26 148 Z" fill="url(#laptopGrad)" stroke="#64748b" stroke-width="1"/>
  
  <!-- Laptop Screen Frame -->
  <rect x="42" y="42" width="108" height="84" rx="4" fill="url(#laptopGrad)" stroke="#64748b" stroke-width="1"/>
  
  <!-- Laptop Screen -->
  <rect x="48" y="48" width="96" height="72" rx="2" fill="url(#screenGrad)"/>
  
  <!-- Shield inside screen -->
  <g transform="translate(96, 84)">
    <!-- Shield shape -->
    <path d="M0 -28 L22 -20 L22 6 C22 18 11 28 0 34 C-11 28 -22 18 -22 6 L-22 -20 Z" 
          fill="url(#shieldBorder)" opacity="0.9"/>
    <path d="M0 -24 L19 -17 L19 5 C19 15 10 24 0 29 C-10 24 -19 15 -19 5 L-19 -17 Z" 
          fill="#1e293b"/>
    
    <!-- Quadrant dividers -->
    <line x1="0" y1="-18" x2="0" y2="22" stroke="#64748b" stroke-width="1"/>
    <line x1="-17" y1="2" x2="17" y2="2" stroke="#64748b" stroke-width="1"/>
    
    <!-- Top Left - Orange -->
    <rect x="-16" y="-16" width="14" height="16" fill="#f59e0b" rx="1"/>
    <rect x="-14" y="-13" width="10" height="2" fill="#fef3c7" rx="0.5"/>
    <rect x="-14" y="-9" width="10" height="2" fill="#fef3c7" rx="0.5"/>
    <rect x="-14" y="-5" width="10" height="2" fill="#fef3c7" rx="0.5"/>
    
    <!-- Top Right - Red -->
    <rect x="2" y="-16" width="14" height="16" fill="#ef4444" rx="1"/>
    <circle cx="8" cy="-8" r="3" fill="none" stroke="#fecaca" stroke-width="1.5"/>
    <rect x="10" y="-9" width="5" height="2" fill="#fecaca"/>
    
    <!-- Bottom Left - Green -->
    <rect x="-16" y="4" width="14" height="16" fill="#22c55e" rx="1"/>
    <rect x="-14" y="14" width="3" height="4" fill="#dcfce7" rx="0.5" transform="rotate(180 -12.5 16)"/>
    <rect x="-10" y="12" width="3" height="6" fill="#dcfce7" rx="0.5" transform="rotate(180 -8.5 15)"/>
    <rect x="-6" y="10" width="3" height="8" fill="#dcfce7" rx="0.5" transform="rotate(180 -4.5 14)"/>
    
    <!-- Bottom Right - Blue -->
    <rect x="2" y="4" width="14" height="16" fill="#3b82f6" rx="1"/>
    <rect x="5" y="8" width="8" height="6" fill="#dbeafe" rx="1"/>
    <circle cx="9" cy="16" r="2" fill="#fbbf24"/>
  </g>
  
  <!-- Camera dot -->
  <circle cx="96" cy="45" r="1.5" fill="#475569"/>
  
  <!-- Text -->
  <text x="96" y="168" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" font-weight="bold">IT ZYZTEM</text>
</svg>
