<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <!-- Laptop body gradient -->
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <!-- Screen gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <!-- Shield gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8"/>
      <stop offset="50%" style="stop-color:#e2e8f0"/>
      <stop offset="100%" style="stop-color:#64748b"/>
    </linearGradient>
  </defs>
  
  <!-- Square background with rounded corners -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  <rect x="4" y="4" width="504" height="504" rx="60" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.3"/>
  
  <!-- Laptop Base -->
  <path d="M96 340 L416 340 L440 380 L72 380 Z" fill="url(#laptopGrad)" stroke="#64748b" stroke-width="2"/>
  <!-- Laptop base shine -->
  <path d="M96 340 L416 340 L420 345 L92 345 Z" fill="#64748b" opacity="0.5"/>
  
  <!-- Laptop Screen Frame -->
  <rect x="108" y="115" width="296" height="215" rx="8" fill="url(#laptopGrad)" stroke="#64748b" stroke-width="2"/>
  
  <!-- Laptop Screen -->
  <rect x="120" y="125" width="272" height="195" rx="4" fill="url(#screenGrad)"/>
  
  <!-- Shield inside screen -->
  <g transform="translate(256, 222)">
    <!-- Shield shape -->
    <path d="M0 -75 L60 -55 L60 15 C60 50 30 75 0 90 C-30 75 -60 50 -60 15 L-60 -55 Z" 
          fill="url(#shieldBorder)" opacity="0.9"/>
    <path d="M0 -68 L54 -50 L54 12 C54 44 27 67 0 80 C-27 67 -54 44 -54 12 L-54 -50 Z" 
          fill="#1e293b"/>
    
    <!-- Quadrant dividers -->
    <line x1="0" y1="-50" x2="0" y2="60" stroke="#64748b" stroke-width="2"/>
    <line x1="-50" y1="5" x2="50" y2="5" stroke="#64748b" stroke-width="2"/>
    
    <!-- Top Left - Orange (Assets/Server) -->
    <rect x="-48" y="-48" width="44" height="48" fill="#f59e0b" rx="2"/>
    <rect x="-40" y="-40" width="28" height="6" fill="#fef3c7" rx="1"/>
    <rect x="-40" y="-30" width="28" height="6" fill="#fef3c7" rx="1"/>
    <rect x="-40" y="-20" width="28" height="6" fill="#fef3c7" rx="1"/>
    <circle cx="-36" cy="-37" r="2" fill="#f59e0b"/>
    <circle cx="-36" cy="-27" r="2" fill="#f59e0b"/>
    <circle cx="-36" cy="-17" r="2" fill="#f59e0b"/>
    
    <!-- Top Right - Red (Credentials) -->
    <rect x="4" y="-48" width="44" height="48" fill="#ef4444" rx="2"/>
    <!-- Key icon -->
    <circle cx="20" cy="-30" r="8" fill="none" stroke="#fecaca" stroke-width="3"/>
    <rect x="26" y="-32" width="16" height="6" fill="#fecaca" rx="1"/>
    <rect x="36" y="-28" width="4" height="8" fill="#fecaca"/>
    <rect x="32" y="-28" width="4" height="6" fill="#fecaca"/>
    
    <!-- Bottom Left - Green (Dashboard/Charts) -->
    <rect x="-48" y="10" width="44" height="44" fill="#22c55e" rx="2"/>
    <!-- Bar chart -->
    <rect x="-42" y="38" width="8" height="12" fill="#dcfce7" rx="1" transform="rotate(180 -38 44)"/>
    <rect x="-30" y="30" width="8" height="20" fill="#dcfce7" rx="1" transform="rotate(180 -26 40)"/>
    <rect x="-18" y="22" width="8" height="28" fill="#dcfce7" rx="1" transform="rotate(180 -14 36)"/>
    <!-- Checkmark -->
    <path d="M-30 20 L-24 26 L-14 16" fill="none" stroke="#dcfce7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom Right - Blue (Tickets) -->
    <rect x="4" y="10" width="44" height="44" fill="#3b82f6" rx="2"/>
    <!-- Ticket icon -->
    <rect x="12" y="18" width="28" height="20" fill="#dbeafe" rx="2"/>
    <circle cx="26" cy="38" r="6" fill="#3b82f6"/>
    <path d="M23 38 L25 40 L29 36" fill="none" stroke="#dbeafe" stroke-width="2" stroke-linecap="round"/>
    <!-- Alert badge -->
    <circle cx="38" cy="20" r="6" fill="#fbbf24"/>
    <text x="38" y="24" text-anchor="middle" fill="#1e293b" font-size="10" font-weight="bold">!</text>
  </g>
  
  <!-- Laptop camera dot -->
  <circle cx="256" cy="118" r="3" fill="#475569"/>
  
  <!-- IT MGMT text below laptop -->
  <text x="256" y="430" text-anchor="middle" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="36" font-weight="bold">IT ZYZTEM</text>
</svg>
